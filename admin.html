<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>모의고사 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="api.js"></script>
<script src="review.js"></script>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ssGet = k => { try { return sessionStorage.getItem('toefl-admin:' + k); } catch (e) { return null; } };
const ssSet = (k, v) => { try { v == null ? sessionStorage.removeItem('toefl-admin:' + k) : sessionStorage.setItem('toefl-admin:' + k, v); } catch (e) {} };
const LET = ['A', 'B', 'C', 'D'];
RV_MINE = '학생 답';
const PART_LABEL = { '0w': 'M1 단어', '0r': 'M1 리딩', '1w': 'M2 단어', '1r': 'M2 리딩', resp: 'Best Response', conv: 'Conversation', ann: 'Announcement', talk: 'Academic Talk' };
const LC_TYPE = { response: 'Best Response', conversation: 'Conversation', announcement: 'Announcement', talk: 'Academic Talk' };
const modName = mi => (mi === 0 || mi === 1 ? `M${mi + 1}` : '전체');
// 빈칸 모아 풀기 기록은 testId가 없고 practice: { from, to }가 있다.
// 리스닝 기록은 lc: { id, title }가 있다.
const testLabel = a => (a.lc ? `리스닝 ${a.lc.title}${a.secs && a.secs.length ? ` (${a.secs.map(s => LC_TYPE[s] || s).join(' · ')})` : ''}` : !a.practice ? `TEST ${a.testId}` : a.practice.from === a.practice.to ? `빈칸 TEST ${a.practice.from}` : `빈칸 TEST ${a.practice.from}–${a.practice.to}`);
const modLabel = a => (a.practice ? '빈칸' : modName(a.module));
const rowLabel = x => (x.t != null ? `T${x.t} ` : '') + `M${x.mi + 1}-${x.n}`;
// 학생 이름은 띄어쓰기만 다르면 한 사람으로 본다. 이름에 '테스트'·'확인용'이 들어간 기록은 선생님 확인용으로 보고 숨길 수 있다.
const nk = s => String(s ?? '').replace(/\s+/g, '');
const isTestName = a => /테스트|확인용/.test(a.name);
const dkey = ms => { const d = new Date(ms); return isNaN(d) ? '' : `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const today = () => dkey(Date.now());
const addDays = (k, n) => { const d = new Date(k + 'T12:00'); d.setDate(d.getDate() + n); return dkey(d.getTime()); };
const dlabel = k => { const d = new Date(k + 'T00:00'); return `${d.getMonth() + 1}/${d.getDate()} (${'일월화수목금토'[d.getDay()]})`; };
const pct = a => (a.total ? Math.round(a.score / a.total * 100) : 0);
const pill = v => `<span class="pill ${v >= 80 ? 'p-good' : v >= 50 ? 'p-mid' : 'p-bad'}">${v}%</span>`;
const secsOf = a => (a.used || []).reduce((n, x) => n + (Number(x) || 0), 0);
const hm = t => (t >= 3600 ? `${Math.floor(t / 3600)}시간 ${Math.round(t % 3600 / 60)}분` : `${Math.round(t / 60)}분`);
// 기간·반·회차·날짜·이름 필터 (빈 값이면 전체). 학생별·회차별·많이 틀린 문항·전체 기록이 함께 쓴다.
const inFilter = a => (!S.period || a.period === S.period) && (!S.cls || a.cls === S.cls) &&
  (S.filter === 'all' || (S.filter === 'words' ? !!a.practice : S.filter === 'lc' ? !!a.lc : !a.practice && !a.lc && String(a.testId) === S.filter)) &&
  (!S.from || dkey(a.finishedAt) >= S.from) && (!S.to || dkey(a.finishedAt) <= S.to) &&
  (!S.hideTest || !isTestName(a)) && (!S.q || nk(a.name).includes(nk(S.q)));
const fmtDate = ms => { const d = new Date(ms); return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const fmtTime = s => { s = Math.max(0, Math.round(s || 0)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

// busy: 지금 진행 중인 요청들 ({ results: true, lc: true, ... }). 하나가 끝나도 다른 요청의 '불러오는 중'은 그대로 둔다.
// file / lcFile: 올리려고 고른 파일 (화면을 다시 그려도 사라지지 않게 여기 둔다)
// open: 학생별 탭에서 펼친 학생, days: 그 학생의 펼친 날짜들, hwKind: 회차별 확인에서 볼 시험 종류 (rc 리딩, lc 리스닝)
const S = { pw: ssGet('pw') || '', loggedIn: false, tab: ssGet('tab') || 'students', busy: {}, msg: null, settings: null, file: null, lcFile: null,
  results: null, period: '', cls: '', filter: 'all', from: '', to: '', q: '', hideTest: true, sel: null, open: null, days: null, daysFor: null, hwKind: 'rc',
  onlyWrong: true, rvMode: 'screen', rv: {}, tests: null, confirm: null };

const call = (action, body) => api(action, Object.assign({ pw: S.pw }, body || {}));
// 오류·경고는 놓치지 않게 더 오래 둔다
function flash(kind, text) { S.msg = { kind, text }; render(); clearTimeout(flash.t); flash.t = setTimeout(() => { S.msg = null; render(); }, kind === 'ok' ? 4000 : 15000); }
async function run(key, fn) {
  if (S.busy[key]) return;
  S.busy[key] = true; render();
  try { await fn(); } catch (e) { flash('bad', e.message); }
  delete S.busy[key]; render();
}

async function login(pw) {
  S.pw = pw;
  await run('login', async () => {
    const j = await call('adminLogin'); S.settings = j.settings; S.loggedIn = true; ssSet('pw', pw);
    loadResults(); loadTests(); loadLc();
  });
  if (!S.loggedIn) S.pw = '';
}
async function loadResults() { await run('results', async () => { S.results = numberTries((await call('listResults')).results); }); }
// 같은 학생이 같은 시험(모듈)을 몇 번째로 냈는지 (a.try)
function numberTries(list) {
  const seen = {};
  list.slice().sort((a, b) => a.finishedAt - b.finishedAt).forEach(a => { const k = [a.cls, nk(a.name), testLabel(a), modLabel(a)].join('|'); a.try = seen[k] = (seen[k] || 0) + 1; });
  return list;
}
async function loadTests() { await run('tests', async () => { const j = await call('listTests'); S.tests = j.tests; }); }
async function loadLc() { await run('lc', async () => { const j = await call('listLc'); S.lc = j.tests; S.lcAudio = j.audio; S.lcEx = j.ex || {}; }); }

/* ---------- 화면 ---------- */
function topBar() {
  return `<header class="bar"><div class="wrap"><span class="brand">NEW TOEFL<small>관리자</small></span><span class="spacer"></span>
    <a class="chip" href="index.html" style="color:inherit;text-decoration:none">학생 페이지 열기</a>
    ${S.loggedIn ? `<button class="link" data-act="logout">로그아웃</button>` : ''}</div></header>`;
}
function viewLogin() {
  if (!window.API_URL) return `<div class="banner warn">config.js에 서버 주소(API_URL)가 아직 없어요. Apps Script를 배포한 뒤 그 웹 앱 URL을 넣어 주세요.</div>`;
  return `<form class="sheet form" id="login" style="max-width:380px"><h2>관리자 로그인</h2>
    <label class="field">비밀번호<input type="password" id="pw" autocomplete="current-password"></label>
    ${S.msg ? `<div class="banner ${S.msg.kind}">${esc(S.msg.text)}</div>` : ''}
    <div><button class="btn primary" type="submit"${S.busy.login ? ' disabled' : ''}>${S.busy.login ? '확인 중…' : '로그인'}</button></div>
    <p class="hint">처음 비밀번호는 Apps Script 코드에 적힌 기본값이에요. 로그인한 뒤 설정 탭에서 꼭 바꿔 주세요.</p></form>`;
}
function tabs() {
  const T = [['students', '학생별'], ['homework', '회차별 확인'], ['hard', '많이 틀린 문항'], ['results', '전체 기록'], ['settings', '설정'], ['tests', '문제']];
  return `<div class="tabs">${T.map(([k, l]) => `<button class="tab${S.tab === k ? ' on' : ''}" data-act="tab" data-tab="${k}">${l}</button>`).join('')}</div>`;
}

// 학생별·회차별 확인·많이 틀린 문항·전체 기록 위에 함께 나오는 거르기 줄
function filterBar(extra) {
  const R = S.results;
  const testIds = [...new Set(R.filter(a => !a.practice && !a.lc).map(a => a.testId))].sort((a, b) => a - b);
  const hasWords = R.some(a => a.practice);
  // 기간은 기록에 있는 것만, 반은 고른 기간의 기록에 있는 것만 (괄호 안은 기록 수)
  const periods = [...new Set(R.map(a => a.period).filter(Boolean))].sort().reverse();
  const counts = {}; R.forEach(a => { if (a.cls && (!S.period || a.period === S.period) && (!S.hideTest || !isTestName(a))) counts[a.cls] = (counts[a.cls] || 0) + 1; });
  const classes = Object.keys(counts).sort((a, b) => a.localeCompare(b, 'ko'));
  const t = today(), chips = [['오늘', t, t], ['어제', addDays(t, -1), addDays(t, -1)], ['최근 7일', addDays(t, -6), t], ['전체 날짜', '', '']];
  return `<div class="sheet filters">
    <div class="toolbar">
      <select id="period" aria-label="기간 선택"><option value="">전체 기간</option>${periods.map(p => `<option value="${esc(p)}"${S.period === p ? ' selected' : ''}>${esc(p)}</option>`).join('')}</select>
      <select id="cls" aria-label="반 선택"><option value="">전체 반</option>${classes.map(c => `<option value="${esc(c)}"${S.cls === c ? ' selected' : ''}>${esc(c)} (${counts[c]})</option>`).join('')}</select>
      <select id="filter" aria-label="회차 선택"><option value="all">전체 회차</option>${R.some(a => a.lc) ? `<option value="lc"${S.filter === 'lc' ? ' selected' : ''}>리스닝</option>` : ''}${hasWords ? `<option value="words"${S.filter === 'words' ? ' selected' : ''}>빈칸 모아 풀기</option>` : ''}${testIds.map(id => `<option value="${id}"${S.filter === String(id) ? ' selected' : ''}>TEST ${id}</option>`).join('')}</select>
      <input type="date" id="from" value="${S.from}" aria-label="시작 날짜"><span class="note">~</span><input type="date" id="to" value="${S.to}" aria-label="끝 날짜">
      ${chips.map(([l, f, e]) => `<button class="dchip" data-act="dq" data-from="${f}" data-to="${e}" aria-pressed="${S.from === f && S.to === e}">${l}</button>`).join('')}
    </div>
    <div class="toolbar">
      <form id="sf" class="toolbar" style="gap:6px"><input type="text" id="q" value="${esc(S.q)}" placeholder="학생 이름" aria-label="학생 검색"><button class="btn small" type="submit">검색</button>${S.q ? '<button class="btn small" type="button" data-act="qclear">지우기</button>' : ''}</form>
      <label class="check note"><input type="checkbox" id="hideTest" ${S.hideTest ? 'checked' : ''}> 테스트 기록 숨기기</label>
      <span class="spacer"></span>${extra || ''}
      <button class="btn small" data-act="reload"${S.busy.results ? ' disabled' : ''}>${S.busy.results ? '불러오는 중…' : '새로고침'}</button>
    </div></div>`;
}
const noResults = () => `<div class="empty">${S.busy.results ? '불러오는 중…' : '기록을 불러오지 못했어요.'}</div>`;
const tiles = items => `<div class="stats">${items.map(([l, v]) => `<div class="part"><div class="lbl">${l}</div><div class="val">${v}</div></div>`).join('')}</div>`;

// 학생별: 반·이름으로 묶어 최근 14일, 푼 날, 응시 횟수, 평균, 최근 점수, 학습 시간. 이름을 누르면 날짜별 기록이 펼쳐진다.
function students(list) {
  const m = new Map();
  list.forEach(a => { const k = a.cls + '|' + nk(a.name); if (!m.has(k)) m.set(k, { k, cls: a.cls, name: a.name.trim(), names: new Set(), runs: [] }); const s = m.get(k); s.names.add(a.name.trim()); s.runs.push(a); });
  return [...m.values()].map(s => {
    s.runs.sort((a, b) => b.finishedAt - a.finishedAt); s.n = s.runs.length; s.avg = Math.round(s.runs.reduce((n, a) => n + pct(a), 0) / s.n);
    s.last = s.runs[0]; s.secs = s.runs.reduce((n, a) => n + secsOf(a), 0); s.days = new Set(s.runs.map(a => dkey(a.finishedAt))).size; return s;
  }).sort((a, b) => a.cls.localeCompare(b.cls, 'ko') || a.name.localeCompare(b.name, 'ko'));
}
function viewStudents() {
  if (!S.results) return noResults();
  const list = S.results.filter(inFilter), st = students(list), cols = S.cls ? 8 : 9;
  const avg = list.length ? Math.round(list.reduce((n, a) => n + pct(a), 0) / list.length) : 0;
  return `<div class="stack">${filterBar()}
    ${!st.length ? `<div class="tablebox"><div class="empty">이 조건에 맞는 기록이 없어요.</div></div>` : `
    ${tiles([['학생', `${st.length}명`], ['응시', `${list.length}회`], ['평균 정답률', `${avg}%`], ['총 학습 시간', hm(list.reduce((n, a) => n + secsOf(a), 0))]])}
    <div class="tablebox"><table><thead><tr>${S.cls ? '' : '<th>반</th>'}<th>이름</th><th>최근 14일</th><th>푼 날</th><th>응시</th><th>평균</th><th>최근 점수</th><th>마지막</th><th>학습 시간</th></tr></thead><tbody>
      ${st.map(s => `<tr class="click${S.open === s.k ? ' sel' : ''}" data-act="stu" data-k="${esc(s.k)}" tabindex="0">${S.cls ? '' : `<td>${s.cls ? esc(s.cls) : '<span class="note">반 없음</span>'}</td>`}
        <td style="white-space:nowrap"><b>${esc(s.name)}</b>${s.names.size > 1 ? ` <span class="note">(${[...s.names].map(esc).join(', ')})</span>` : ''}</td><td>${strip(s)}</td>
        <td class="num">${s.days}일</td><td class="num">${s.n}회</td><td class="num">${pill(s.avg)}</td><td class="num">${pill(pct(s.last))}</td><td class="num">${fmtDate(s.last.finishedAt)}</td><td class="num">${hm(s.secs)}</td></tr>
        ${S.open === s.k ? `<tr class="inside"><td colspan="${cols}">${studentDetail(s)}</td></tr>` : ''}`).join('')}
    </tbody></table></div>
    <p class="hint">이름을 누르면 그 학생의 기록이 날짜별로 열려요. 기록을 누르면 문항별 답안이 나와요. 「최근 14일」은 왼쪽이 오래된 날, 오른쪽이 오늘이에요 (연한 칸 1회, 진한 칸 2회 이상). 띄어쓰기만 다른 이름은 한 학생으로 묶었어요.</p>`}</div>`;
}
// 최근 14일 동안 날마다 몇 번 냈는지 작은 칸으로
function strip(s) {
  const t = today(), cnt = {}; s.runs.forEach(a => { const k = dkey(a.finishedAt); cnt[k] = (cnt[k] || 0) + 1; });
  return `<span class="strip" aria-label="최근 14일 응시">${Array.from({ length: 14 }, (_, i) => { const k = addDays(t, i - 13), c = cnt[k] || 0; return `<i class="${c > 1 ? 'd2' : c ? 'd1' : ''}" title="${dlabel(k)} · ${c}회"></i>`; }).join('')}</span>`;
}
// 학생 한 명의 기록을 날짜별로. 처음에는 가장 최근 날만 펼친다.
function studentDetail(s) {
  const by = new Map(); s.runs.forEach(a => { const k = dkey(a.finishedAt); if (!by.has(k)) by.set(k, []); by.get(k).push(a); });
  if (S.daysFor !== s.k) { S.days = new Set([...by.keys()].slice(0, 1)); S.daysFor = s.k; }
  const hhmm = ms => { const d = new Date(ms); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  return `<div class="tablebox"><table><thead><tr><th>날짜 · 시각</th><th>시험</th><th>모듈</th><th>점수</th><th>소요</th></tr></thead><tbody>
    ${[...by].map(([d, rs]) => { const open = S.days.has(d), avg = Math.round(rs.reduce((n, a) => n + pct(a), 0) / rs.length);
      return `<tr class="click day" data-act="day" data-d="${d}" tabindex="0" aria-expanded="${open}"><td colspan="5">${open ? '▾' : '▸'} <b>${dlabel(d)}</b> <span class="note">· ${rs.length}회 · 평균 ${avg}% · ${hm(rs.reduce((n, a) => n + secsOf(a), 0))}</span></td></tr>
      ${open ? rs.map(a => `<tr class="click${S.sel === a.id ? ' sel' : ''}" data-act="sel" data-id="${esc(a.id)}" tabindex="0"><td class="num">${hhmm(a.finishedAt)}</td><td>${esc(testLabel(a))}</td><td>${modLabel(a)}</td>
        <td class="num"><b>${a.score}/${a.total}</b> ${pill(pct(a))}${a.try > 1 ? ` <span class="note">${a.try}번째</span>` : ''}</td><td class="num">${esc(a.usedText)}</td></tr>
        ${S.sel === a.id ? `<tr class="inside"><td colspan="5">${detail(a)}</td></tr>` : ''}`).join('') : ''}`; }).join('')}
  </tbody></table></div>`;
}

// 회차별 확인: 반 하나의 학생 × 회차 표. 열은 지금 열린 회차와 이 반이 푼 회차. 칸에는 모듈별 최고 점수.
function viewHomework() {
  if (!S.results) return noResults();
  const kindBar = `<div class="toolbar"><span class="note">시험</span>${[['rc', '리딩'], ['lc', '리스닝']].map(([k, l]) => `<button class="dchip" data-act="hwKind" data-k="${k}" aria-pressed="${S.hwKind === k}">${l}</button>`).join('')}</div>`;
  if (!S.cls) return `<div class="stack">${filterBar()}<div class="tablebox"><div class="empty">위에서 반을 먼저 골라 주세요.</div></div></div>`;
  const lc = S.hwKind === 'lc', list = S.results.filter(a => inFilter(a) && !a.practice && (lc ? !!a.lc : !a.lc)), st = students(list);
  const colOf = a => (lc ? a.lc.id : String(a.testId));
  const cols = new Map();
  if (lc) (S.lc || []).filter(t => isOpen(t.no, t.set === 'new' ? 'lcNew' : 'lcTpo')).forEach(t => cols.set(t.id, t.title));
  else (S.tests || []).filter(t => isOpen(t.id)).forEach(t => cols.set(String(t.id), `TEST ${t.id}`));
  list.forEach(a => { if (!cols.has(colOf(a))) cols.set(colOf(a), lc ? a.lc.title : `TEST ${a.testId}`); });
  const order = k => (lc ? [k.startsWith('new') ? 0 : 1, +k.split('-')[1] || 0] : [0, +k || 0]);
  const keys = [...cols.keys()].sort((a, b) => order(a)[0] - order(b)[0] || order(a)[1] - order(b)[1]);
  // 다 푼 회차: Module 1과 2를 모두 냈거나 1 + 2를 이어서 낸 것 (섹션만 골라 푼 기록은 세지 않는다)
  const full = runs => { const m = new Set(runs.filter(a => !(a.secs && a.secs.length)).map(a => a.module)); return m.has(null) || (m.has(0) && m.has(1)); };
  // 칸: 모듈(리스닝은 섹션만 푼 것도 따로)마다 최고 점수와 낸 횟수
  const cell = runs => {
    if (!runs.length) return '<span class="note">–</span>';
    const g = new Map(); runs.forEach(a => { const k = modLabel(a) + (a.secs && a.secs.length ? ' 일부' : ''); if (!g.has(k)) g.set(k, []); g.get(k).push(a); });
    return [...g].sort((a, b) => a[0].localeCompare(b[0])).map(([k, rs]) => `<div class="hwc"><span class="note">${esc(k)}</span>${pill(Math.max(...rs.map(pct)))}${rs.length > 1 ? `<span class="note">×${rs.length}</span>` : ''}</div>`).join('');
  };
  return `<div class="stack">${filterBar()}${kindBar}
    ${!keys.length ? `<div class="tablebox"><div class="empty">열린 회차도, 이 반이 푼 기록도 없어요.</div></div>`
      : !st.length ? `<div class="tablebox"><div class="empty">이 반은 이 조건에서 ${lc ? '리스닝' : '리딩'} 기록이 없어요.</div></div>` : `
    <div class="tablebox"><table class="hw"><thead><tr><th>이름</th><th>진행</th>${keys.map(k => `<th>${esc(cols.get(k))}</th>`).join('')}</tr></thead><tbody>
      ${st.map(s => { const by = keys.map(k => s.runs.filter(a => colOf(a) === k)), done = by.filter(full).length, started = by.filter(r => r.length).length;
        return `<tr><td style="white-space:nowrap"><b>${esc(s.name)}</b></td><td>${done === keys.length ? '<span class="pill p-good">완료</span>' : started ? `<span class="pill p-mid">${done}/${keys.length}</span>` : '<span class="pill p-bad">안 함</span>'}</td>
          ${by.map(r => `<td>${cell(r)}</td>`).join('')}</tr>`; }).join('')}
    </tbody></table></div>
    <p class="hint">「진행」은 Module 1과 2를 모두 낸 회차 수예요. 칸에는 모듈마다 최고 점수가 나오고, 여러 번 냈으면 ×횟수가 붙어요. 「전체」는 Module 1 + 2를 이어서 푼 기록, 「일부」는 섹션만 골라 푼 기록이에요. 열은 지금 열린 회차와 이 반이 푼 회차예요. 이 조건에서 한 번이라도 기록이 있는 학생만 나와요.</p>`}</div>`;
}

// 많이 틀린 문항: 지금 조건의 기록에서 정답률이 낮은 문항 30개 (두 번 이상 풀린 문항만)
function viewHard() {
  if (!S.results) return noResults();
  const m = new Map();
  S.results.filter(inFilter).forEach(a => (a.rows || []).forEach(x => {
    const test = a.lc ? '리스닝 ' + a.lc.title : `TEST ${x.t != null ? x.t : a.testId}`, k = [test, x.mi, x.n, x.kind].join('|');
    if (!m.has(k)) m.set(k, { test, x, tries: 0, ok: 0, wrong: {} });
    const o = m.get(k); o.tries++; if (x.ok) o.ok++; else { const g = x.given || '(빈칸)'; o.wrong[g] = (o.wrong[g] || 0) + 1; }
  }));
  const list = [...m.values()].filter(o => o.tries >= 2).map(o => Object.assign(o, { rate: Math.round(o.ok / o.tries * 100) })).sort((a, b) => a.rate - b.rate || b.tries - a.tries).slice(0, 30);
  return `<div class="stack">${filterBar()}
    ${list.length ? `<div class="tablebox"><table><thead><tr><th>정답률</th><th>푼 횟수</th><th>시험</th><th>문항</th><th>유형</th><th>정답</th><th>많이 쓴 오답</th></tr></thead><tbody>
      ${list.map(o => { const x = o.x, wrong = Object.entries(o.wrong).sort((a, b) => b[1] - a[1]).slice(0, 3);
        return `<tr><td class="num">${pill(o.rate)}</td><td class="num">${o.tries}회</td><td>${esc(o.test)}</td><td class="num">M${x.mi + 1}-${x.n}</td><td>${x.kind === 'w' ? '단어' : x.kind === 'l' ? LC_TYPE[x.type] || '리스닝' : '리딩'}</td>
          <td>${x.correct == null ? '<span class="note">정답 공개 꺼짐</span>' : x.kind === 'w' ? `${esc(x.correct)} <span class="note">(${esc(x.full)})</span>` : esc(x.correct)}</td>
          <td>${wrong.map(([g, n]) => `${esc(g)} <span class="note">${n}회</span>`).join(', ')}</td></tr>`; }).join('')}
    </tbody></table></div><p class="hint">지금 고른 기간·반·회차·날짜에서 정답률이 낮은 문항 30개예요. 두 번 이상 풀린 문항만 넣었어요.</p>`
    : `<div class="tablebox"><div class="empty">이 조건에서 두 번 이상 풀린 문항이 아직 없어요.</div></div>`}</div>`;
}

function answerTable(list) {

        <td class="given ${x.ok ? '' : (x.given ? 'bad' : 'empty')}">${x.given ? esc(x.given) : '(빈칸)'}</td><td>${x.kind === 'w' ? `${esc(x.correct)} <span class="note">(${esc(x.full)})</span>` : esc(x.correct)}</td></tr>`).join('')}
      </tbody></table>` : `<div class="empty">틀린 문항이 없어요.</div>`}</div>`;
}
// 문제 화면: 서버에서 그 기록의 문제(닫힌 회차도)를 받아 지문·문제·보기 위에 학생 답과 정답을 표시한다. S.rv[id] = { status, r, content, err }
async function loadRecord(id) {
  if (!id || (S.rv[id] && S.rv[id].status !== 'err')) return;
  S.rv[id] = { status: 'loading' }; render();
  try { const j = await call('adminResult', { id }); S.rv[id] = { status: 'ok', r: j.result, content: j.content }; }
  catch (e) { S.rv[id] = { status: 'err', err: e.message }; }
  render();
}
function recordScreen(a) {
  const d = S.rv[a.id];
  if (!d || d.status === 'loading') return `<div class="tablebox"><div class="empty">문제를 불러오는 중…</div></div>`;
  if (d.status === 'err') return `<div class="banner bad">${esc(d.err)} <button class="btn small" data-act="rvRetry" data-id="${esc(a.id)}">다시 시도</button></div>`;
  if (S.onlyWrong && !d.r.rows.some(x => !x.ok)) return `<div class="tablebox"><div class="empty">틀린 문항이 없어요.</div></div>`;
  const V = { r: d.r, content: d.content, onlyWrong: S.onlyWrong, seen: new Set() };
  const body = !V.content ? '' : V.r.lc ? lcReviewItems(V, () => '') : V.r.practice ? wordsReviewBody(V) : rcReviewBody(V);
  // 문제를 못 찾았거나 문제가 바뀌어 못 그린 문항은 표로
  const rest = V.r.rows.filter(x => !V.seen.has(x.k));
  return `<div class="stack rvadmin">${body}${rest.some(x => !S.onlyWrong || !x.ok) ? `<p class="note" style="margin:0">${V.content ? '문제가 바뀌어서 아래 문항은 표로만 보여 줘요.' : '이 회차의 문제를 찾을 수 없어서 표로만 보여 줘요.'}</p>${answerTable(rest)}` : ''}</div>`;
}

// 리스닝: 드라이브 음원 폴더 상태, 회차 올리기(lc_tests.json), 세트별 목록
function viewLcTests() {

  const table = set => `<table><thead><tr><th>회차</th><th>Module 1</th><th>Module 2</th><th>해설</th><th>열림</th><th></th></tr></thead><tbody>${rows(set)}</tbody></table>`;

// 음원 올리기: 내려받은 "토플 리스닝 음원" 폴더의 파일(<id>_m<k>.json)을 서버를 거쳐 드라이브 같은 이름 폴더에 넣는다.
// S.auFiles: 고른 음원 파일들, S.auAll: 이미 있는 것도 다시 올릴지, S.au: { total, done, failed, running, t0 }
const AU_NAME = /^(new|tpo)-\d+_m[12]\.json$/;
function audioThere() {
  const a = S.lcAudio, there = new Set(); if (!a || !a.folder || !S.lc) return there;
  const miss = new Set(a.missing || []);
  S.lc.forEach(t => t.modules.forEach((m, mi) => { if (!miss.has(t.title + ' M' + (mi + 1))) there.add(t.id + '_m' + (mi + 1) + '.json'); }));
  return there;
}
function audioTodo() { const there = audioThere(); return (S.auFiles || []).filter(f => S.auAll || !there.has(f.name)); }
function auText() {
  const U = S.au; if (!U) return '';
  const left = U.done ? Math.ceil((Date.now() - U.t0) / U.done * (U.total - U.done) / 60000) : null;
  return `${U.done}/${U.total}개 올림${U.failed.length ? ` · 실패 ${U.failed.length}개` : ''}${U.running ? (left != null ? ` · 약 ${left}분 남음` : ' · 시작하는 중…') : ' · 끝'}`;
}
function viewAudioUpload() {
  const U = S.au, files = S.auFiles || [], todo = audioTodo(), running = U && U.running;
  const mb = n => (n / 1048576).toFixed(0);
  return `<h3 style="margin:12px 0 0">음원 올리기</h3>
    <p class="hint">내려받기 폴더의 "토플 리스닝 음원" 폴더를 고르세요 (파일 186개, 약 540MB). 이미 올라간 음원은 건너뛰어요. 다 올라갈 때까지 이 창을 닫지 마세요.</p>
    <div class="toolbar"><label class="btn${running ? ' disabled' : ''}">폴더 고르기<input type="file" id="auDir" webkitdirectory hidden onchange="pickAudio(this)"${running ? ' disabled' : ''}></label>
      <label class="btn${running ? ' disabled' : ''}">파일 고르기<input type="file" id="auFiles" multiple accept=".json,application/json" hidden onchange="pickAudio(this)"${running ? ' disabled' : ''}></label>
      ${files.length ? `<span class="hint">고른 음원 <b>${files.length}개</b> · 올릴 것 <b>${todo.length}개</b> (${mb(todo.reduce((n, f) => n + f.size, 0))}MB)</span>` : ''}</div>
    ${S.auPicked && !files.length ? `<div class="banner warn">고른 ${S.auPicked}개 파일 중에 음원 파일(예: tpo-7_m1.json)이 없어요. 내려받기 폴더의 "토플 리스닝 음원" 폴더를 골라 주세요.</div>` : ''}
    ${files.length ? `<label class="check"><input type="checkbox" id="auAll"${S.auAll ? ' checked' : ''}${running ? ' disabled' : ''}> 이미 있는 음원도 다시 올리기</label>` : ''}
    <div><button class="btn primary" data-act="auUpload"${running || !todo.length ? ' disabled' : ''}>${running ? '올리는 중…' : '음원 올리기'}</button></div>
    ${U ? `<div class="lcbar"><div id="aufill" style="width:${U.total ? Math.round(U.done / U.total * 100) : 0}%"></div></div><div class="hint num" id="autxt">${auText()}</div>` : ''}
    ${U && U.failed.length && !running ? `<div class="banner bad">못 올린 음원: ${esc(U.failed.join(', '))}<br>같은 폴더를 다시 골라 올리면 빠진 것만 올라가요.</div>` : ''}`;
}
async function uploadAudio() {
  const list = audioTodo(); if (!list.length || (S.au && S.au.running)) return;
  S.au = { total: list.length, done: 0, failed: [], running: true, t0: Date.now() }; render();
  const tick = () => { const f = document.getElementById('aufill'), t = document.getElementById('autxt');
    if (f) f.style.width = Math.round(S.au.done / S.au.total * 100) + '%'; if (t) t.textContent = auText(); };
  const one = async f => {
    let err = '';
    for (let i = 1; i <= 3; i++) {
      try {
        const j = await call('saveAudio', { name: f.name, data: await f.text() });
        if (j.size !== f.size) throw new Error('크기가 맞지 않아요');
        S.au.done++; tick(); return;
      } catch (e) { err = e.message; if (/비밀번호/.test(err)) break; await new Promise(r => setTimeout(r, 2000 * i)); }
    }
    S.au.failed.push(f.name + (err ? ' (' + err + ')' : '')); S.au.done++; tick();
  };
  await one(list[0]);  // 첫 파일은 혼자 보내 드라이브 폴더를 먼저 만든다
  let next = 1;
  const worker = async () => { while (next < list.length) await one(list[next++]); };
  await Promise.all([worker(), worker(), worker()]);
  S.au.running = false; S.auFiles = null; render();
  flash(S.au.failed.length ? 'bad' : 'ok', S.au.failed.length ? `음원 ${S.au.total - S.au.failed.length}개를 올렸고 ${S.au.failed.length}개는 못 올렸어요.` : `음원 ${S.au.total}개를 다 올렸어요.`);
  loadLc();
}
// 파일 고르기: 고르는 창이 열려 있는 동안 화면이 다시 그려져도 놓치지 않게 입력칸에 직접 붙인 onchange로 받는다
function pickFile(el) { S[el.id] = el.files && el.files[0] || null; render(); }
function pickAudio(el) {
  const all = [...(el.files || [])].filter(f => !f.name.startsWith('.'));
  S.auFiles = all.filter(f => AU_NAME.test(f.name)); S.auPicked = all.length; S.au = null; render();
}
window.addEventListener('beforeunload', e => { if (S.au && S.au.running) { e.preventDefault(); e.returnValue = ''; } });
// 리딩은 칸이 비어 있으면 전부 열림, 리스닝(lcNew·lcTpo)은 칸이 비어 있으면 전부 닫힘 (서버와 같은 규칙)
function isOpen(id, key) {
  const s = (S.settings && S.settings[key || 'open'] || '').trim(); if (!s) return !(key === 'lcNew' || key === 'lcTpo');
  return s.split(/[,\s]+/).filter(Boolean).some(p => { const m = p.match(/^(\d+)\s*[-~]\s*(\d+)$/); return m ? id >= +m[1] && id <= +m[2] : +p === id; });
}
function viewConfirm() {
  const c = S.confirm; if (!c) return '';
  return `<div class="modal" role="dialog" aria-modal="true"><div class="box"><h3>${esc(c.title)}</h3><p class="note" style="margin:0">${esc(c.text)}</p>
    <div class="row"><button class="btn" data-act="cancel">취소</button><button class="btn danger" data-act="confirmDo">${esc(c.label)}</button></div></div></div>`;
}
function render() {
  const app = document.getElementById('app'), active = document.activeElement && document.activeElement.id;
  let body;
  if (!S.loggedIn) body = viewLogin();
  else body = tabs() + (S.msg ? `<div class="banner ${S.msg.kind}" style="margin-bottom:14px">${esc(S.msg.text)}</div>` : '') +
    ({ students: viewStudents, homework: viewHomework, hard: viewHard, results: viewResults, settings: viewSettings, tests: viewTests }[S.tab] || viewStudents)();
  app.innerHTML = topBar() + `<main class="wrap">${body}</main>` + viewConfirm();
  if (active) { const el = document.getElementById(active); if (el) el.focus(); }
}

/* ---------- 이벤트 ---------- */
document.addEventListener('submit', ev => {
  ev.preventDefault();
  const f = ev.target;
  if (f.id === 'login') login(f.querySelector('#pw').value.trim());
  else if (f.id === 'sf') { S.q = f.querySelector('#q').value.trim(); S.open = S.sel = null; render(); }
  else if (f.id === 'settingsForm') run('settings', async () => {
    const j = await call('saveSettings', { settings: { code: f.querySelector('#code').value, open: f.querySelector('#open').value, showAnswers: f.querySelector('#showAnswers').checked,
      lcNew: f.querySelector('#lcNew').value, lcTpo: f.querySelector('#lcTpo').value } });
    S.settings = j.settings; flash('ok', '저장했어요.');
  });
  else if (f.id === 'pwForm') {
    const a = f.querySelector('#newPw').value, b = f.querySelector('#newPw2').value;
    if (a !== b) return flash('bad', '두 비밀번호가 서로 달라요.');
    run('pw', async () => { await call('changePassword', { newPw: a }); S.pw = a; ssSet('pw', a); S.settings.pwIsDefault = false; flash('ok', '비밀번호를 바꿨어요.'); });
  }
});
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'tab') { S.tab = b.dataset.tab; ssSet('tab', S.tab); S.msg = null; render(); }
  else if (act === 'stu') { S.open = S.open === b.dataset.k ? null : b.dataset.k; S.sel = null; render(); }
  else if (act === 'day') { const d = b.dataset.d; S.days.has(d) ? S.days.delete(d) : S.days.add(d); render(); }
  else if (act === 'dq') { S.from = b.dataset.from; S.to = b.dataset.to; S.open = S.sel = null; render(); }
  else if (act === 'qclear') { S.q = ''; S.open = S.sel = null; render(); }
  else if (act === 'hwKind') { S.hwKind = b.dataset.k; render(); }
  else if (act === 'logout') { S.loggedIn = false; S.pw = ''; ssSet('pw', null); S.results = S.tests = S.lc = null; render(); }
  else if (act === 'delLcAsk') { const id = b.dataset.id, t = (S.lc || []).find(x => x.id === id);
    S.confirm = { title: `리스닝 ${t ? t.title : id}을 지울까요?`, text: '문제가 시트에서 지워져요. 드라이브 음원과 이미 제출된 결과는 그대로 남아요.', label: '지우기', fn: () => run('delLc', async () => { const j = await call('deleteLc', { id }); S.lc = j.tests; S.lcEx = j.ex || {}; flash('ok', '지웠어요.'); }) }; render(); }
  else if (act === 'lcUpload') {
    const file = S.lcFile;
    if (!file) return flash('bad', '먼저 lc_tests.json 파일을 골라 주세요.');
    run('lcUpload', async () => {
      let data; try { data = JSON.parse(await file.text()); } catch (e) { throw new Error('JSON 파일이 아니거나 형식이 깨졌어요.'); }
      const j = await call('saveLc', { tests: data });
      S.lc = j.tests; S.lcEx = j.ex || {}; S.lcFile = null;
      if (j.explained) flash('ok', `리스닝 추가 ${j.added}회차, 갱신 ${j.updated}회차, 해설 ${j.explained}회차.`);
      else flash('warn', `리스닝 추가 ${j.added}회차, 갱신 ${j.updated}회차. 이 파일에는 해설이 없어요. 해설을 올리려면 lc_tests_해설.json을 골라 주세요.`);
      loadLc();  // 빠진 음원 목록도 새로
    });
  }
  else if (act === 'reload') loadResults();
  else if (act === 'auUpload') uploadAudio();
  else if (act === 'sel') { S.sel = S.sel === b.dataset.id ? null : b.dataset.id; render(); if (S.sel && S.rvMode === 'screen') loadRecord(S.sel); }
  else if (act === 'rvMode') { S.rvMode = b.dataset.k; render(); if (S.rvMode === 'screen') loadRecord(S.sel); }
  else if (act === 'rvRetry') loadRecord(b.dataset.id);
  else if (act === 'delAsk') { const a = S.results.find(x => x.id === b.dataset.id);
    S.confirm = { title: '기록을 지울까요?', text: `${a.name} · ${testLabel(a)} ${modLabel(a)} · ${a.score}/${a.total} 기록이 시트에서도 지워져요. 되돌릴 수 없어요.`, label: '지우기', fn: () => run('del', async () => { await call('deleteResult', { id: a.id }); S.results = S.results.filter(x => x.id !== a.id); if (S.sel === a.id) S.sel = null; flash('ok', '지웠어요.'); }) }; render(); }
  else if (act === 'delTestAsk') { const id = +b.dataset.id;
    S.confirm = { title: `TEST ${id}을 지울까요?`, text: '문제가 시트에서 지워져요. 이미 제출된 결과는 그대로 남아요.', label: '지우기', fn: () => run('delTest', async () => { S.tests = (await call('deleteTest', { id })).tests; flash('ok', `TEST ${id}을 지웠어요.`); }) }; render(); }
  else if (act === 'cancel') { S.confirm = null; render(); }
  else if (act === 'confirmDo') { const fn = S.confirm.fn; S.confirm = null; fn(); }
  else if (act === 'upload') {
    const file = S.file;
    if (!file) return flash('bad', '먼저 tests.json 파일을 골라 주세요.');
    run('upload', async () => {
      let data; try { data = JSON.parse(await file.text()); } catch (e) { throw new Error('JSON 파일이 아니거나 형식이 깨졌어요.'); }
      const j = await call('saveTests', { tests: data });
      S.tests = j.tests; S.file = null; flash('ok', `추가 ${j.added}회차, 갱신 ${j.updated}회차.`);
    });
  }
  else if (act === 'csv') {
    const list = S.results.filter(inFilter);
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const csv = [['기간', '반', '이름', '시험', '모듈', '제출 시각', '점수', '만점', 'M1 단어', 'M1 리딩', 'M2 단어', 'M2 리딩', '소요', '틀린 문항'].map(q).join(',')]
      .concat(list.map(a => [a.period, a.cls, a.name, testLabel(a), modLabel(a), fmtDate(a.finishedAt), a.score, a.total, a.parts['0w'], a.parts['0r'], a.parts['1w'], a.parts['1r'], a.usedText, a.wrong].map(q).join(','))).join('\n');
    navigator.clipboard.writeText(csv).then(() => flash('ok', `${list.length}줄을 복사했어요. 엑셀이나 시트에 붙여 넣으세요.`), () => flash('bad', '복사하지 못했어요. 구글 시트의 결과 탭을 직접 열어 주세요.'));
  }
});
document.addEventListener('keydown', ev => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('tr[data-act="sel"], tr[data-act="stu"], tr[data-act="day"]')) { ev.preventDefault(); ev.target.click(); } });
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'auAll') { S.auAll = el.checked; render(); }
  else if (el.id === 'filter') { S.filter = el.value; S.open = S.sel = null; render(); }
  else if (el.id === 'period') { S.period = el.value; S.cls = ''; S.open = S.sel = null; render(); }
  else if (el.id === 'cls') { S.cls = el.value; S.open = S.sel = null; render(); }
  else if (el.id === 'from') { S.from = el.value; if (S.to && S.from > S.to) S.to = S.from; S.open = S.sel = null; render(); }
  else if (el.id === 'to') { S.to = el.value; if (S.from && S.to < S.from) S.from = S.to; S.open = S.sel = null; render(); }
  else if (el.id === 'hideTest') { S.hideTest = el.checked; S.open = S.sel = null; render(); }
  else if (el.id === 'onlyWrong') { S.onlyWrong = el.checked; render(); }
});

render();
if (S.pw) login(S.pw);
</script>
</body>
</html>
