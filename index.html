<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>NEW TOEFL 모의고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<!-- 반 목록은 딕테이션 사이트의 classes.js를 같이 쓴다 (PERIODS). 못 불러오면 반 이름을 직접 입력한다. -->
<script src="https://yeibin0813.github.io/dictation/classes.js"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script src="listening.js"></script>
<script>
const LS = 'toefl-rq2';
const lsGet = k => { try { return JSON.parse(localStorage.getItem(LS + k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(LS + k) : localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LET = ['A', 'B', 'C', 'D'];
const BLANK = /\[(\d+)\]/g;
const PART_LABEL = { '0w': 'M1 Complete the Words', '0r': 'M1 Reading', '1w': 'M2 Complete the Words', '1r': 'M2 Reading', w: 'Complete the Words' };

// S.pick: { test(정답 없음), showAnswers } — 회차를 고른 뒤 모듈과 제한 시간을 고르는 화면
// S.exam: { test, showAnswers, mod, set, answers, startedAt, limit(분, 0이면 제한 없음), endsAt(제한 없으면 null), used }
//   빈칸 모아 풀기면 kind: 'words', from, to가 붙고, test는 빈칸 지문만 담은 모듈 하나짜리다.
//   이때 지문마다 kp("회차-모듈")가 있어 답 키가 "7-0-3"처럼 회차끼리 겹치지 않는다.
//   리스닝 시험이면 kind: 'lc' (listening.js 참고)
// S.mine: 내 기록 (서버에서 같은 반·이름으로 찾은 것) { status: 'loading' | 'ok' | 'err', list, added(이번에 새로 낸 것), err, more }
// S.review: 기록 하나 다시 보기 { id, back('home' | 'result'), status, r, showAnswers, content, onlyWrong, err }
const S = { screen: 'home', name: lsGet(':name') || '', code: lsGet(':code') || '', period: lsGet(':period') || '', cls: lsGet(':cls') || '',
  tab: lsGet(':tab') || 'rc', entered: false, tests: [], lcTests: [], pick: null, lcPick: null, exam: lsGet(':exam'), result: null, modal: null, busy: '', err: '',
  mine: null, review: null };
// 딕테이션과 같은 반 목록: 기간 → 반 그룹 → 반. 반 값은 "주니어 화목 U반"처럼 그룹 이름을 붙여 저장한다.
const PERS = typeof PERIODS !== 'undefined' && Array.isArray(PERIODS) ? PERIODS : null;
function periodNow() {
  if (!PERS || !PERS.length) return null;
  const d = new Date(), title = `${d.getFullYear()}년 ${d.getMonth() + 1}월`;
  return PERS.find(p => p.title === (S.period || title)) || PERS.find(p => p.title === title) || PERS[0];
}
lsSet(':mine', null); // 예전에는 기록을 이 기기에만 모았다. 이제 서버에서 받는다.
const LIM = lsGet(':lim') || {}; // 모듈별로 마지막에 쓴 제한 시간 ("4-0": 18)
const WR = lsGet(':wr') || {};   // 빈칸 모아 풀기에서 마지막에 고른 범위와 제한 시간 { from, to, lim }
// 다 풀고 보내는 중에 끊겼던 답안은 다시 보내는 화면부터 (시험 화면으로 돌아가지 않는다)
if (S.exam && S.exam.done) { S.screen = 'result'; S.result = { pending: S.exam, status: 'fail', err: '지난번에 답안을 다 보내지 못했어요.' }; }
else if (S.exam && (S.exam.limit != null || S.exam.kind === 'lc')) S.screen = 'exam'; else if (S.exam) { S.exam = null; lsSet(':exam', null); }
const limitOf = (id, mi, m) => (LIM[id + '-' + mi] != null ? LIM[id + '-' + mi] : m.minutes);

const fmtTime = s => { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const fmtDate = ms => { const d = new Date(ms); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const fmtMin = m => (m % 1 ? `${Math.floor(m)}분 ${Math.round((m % 1) * 60)}초` : `${m}분`);
const modName = mi => (mi === 0 || mi === 1 ? `Module ${mi + 1}` : mi === 'w' ? '빈칸' : '전체');
const span = p => (p.from === p.to ? `${p.from}` : `${p.from}–${p.to}`);
// 닫힌 회차에 낸 답안은 점수를 돌려받지 않는다 (score가 null)
const scoreText = a => (a.score == null ? '제출함' : `${a.score}/${a.total}`);
const recLabel = a => (a.practice ? `빈칸 TEST ${span(a.practice)}` : a.lc ? `리스닝 ${a.lc.title} · ${modName(a.mod)}${a.secs ? ` (${lcSecNames(a.secs)})` : ''}`
  : a.testId != null ? `TEST ${a.testId} · ${modName(a.mod)}` : a.label || '기록');
// 결과·다시 보기 화면 제목 (HTML)
const recTitle = r => (r.practice ? `빈칸 TEST ${span(r.practice)}` : r.lc ? `리스닝 ${esc(r.lc.title)} · ${modName(r.module)}${r.secs ? ` (${esc(lcSecNames(r.secs))})` : ''}`
  : r.testId != null ? `TEST ${esc(r.testId)} · ${modName(r.module)}` : esc(r.label || '기록'));
const rowLabel = x => (x.t != null ? `T${x.t} ` : '') + `M${x.mi + 1}-${x.n}`;

function blanksOf(set) { const out = []; let i = 0; set.text.replace(BLANK, (a, len) => { out.push({ n: set.start + i++, len: +len }); return a; }); return out; }
const keyPre = (mi, set) => (set.kp != null ? set.kp : mi);
function keysOfSet(mi, set) { return set.type === 'words' ? blanksOf(set).map(b => keyPre(mi, set) + '-' + b.n) : set.questions.map(q => mi + '-' + q.n); }
function rangeOf(set) { const ns = set.type === 'words' ? blanksOf(set).map(b => b.n) : set.questions.map(q => q.n); return (set.t != null ? `T${set.t} ` : '') + (ns.length > 1 ? `${ns[0]}–${ns[ns.length - 1]}` : `${ns[0]}`); }
// 고른 범위 안에서 열린 회차의 빈칸 지문 수와 빈칸 수 (회차 목록의 요약으로 계산)
function wordsCount(from, to) {
  const ts = S.tests.filter(t => t.id >= from && t.id <= to);
  const blanks = ts.reduce((n, t) => n + t.modules.reduce((k, m) => k + m.words, 0), 0);
  return { tests: ts.length, paras: Math.round(blanks / 10), blanks };
}

/* ---------- 입장 ---------- */
async function enter() {
  S.err = '';
  const per = periodNow(); if (per) S.period = per.title;
  if (!S.cls.trim()) { S.err = '반을 선택해 주세요.'; render(); return; }
  if (!S.name.trim()) { S.err = '이름을 입력해 주세요.'; render(); return; }
  if (!S.code.trim()) { S.err = '입장 코드를 입력해 주세요.'; render(); return; }
  S.busy = 'enter'; render();
  try {
    const j = await api('enter', { code: S.code.trim() });
    S.tests = j.tests; S.lcTests = j.lcTests || []; S.entered = true;
    S.name = S.name.trim().replace(/\s+/g, ' ');
    lsSet(':name', S.name); lsSet(':code', S.code.trim()); lsSet(':period', S.period); lsSet(':cls', S.cls.trim());
    loadMine();
  } catch (e) { S.err = e.message; }
  S.busy = ''; render();
}
/* ---------- 내 기록 ---------- */
// 서버에서 같은 반·이름의 기록을 받는다. 받는 동안 새로 낸 기록(added)은 받은 목록 앞에 붙인다.
async function loadMine() {
  const me = S.mine = { status: 'loading', list: null, added: (S.mine && S.mine.added) || [], more: false };
  const shows = () => ['home', 'pick', 'lcpick'].includes(S.screen);
  try {
    const j = await api('myResults', { code: S.code.trim(), name: S.name.trim(), cls: S.cls.trim() });
    if (S.mine !== me) return;  // 그사이 반·이름을 바꿨다
    const ids = new Set(j.results.map(a => a.id));
    me.list = me.added.filter(a => !ids.has(a.id)).concat(j.results.map(a => Object.assign(a, { mod: a.practice ? 'w' : a.module })));
    me.status = 'ok';
  } catch (e) { if (S.mine !== me) return; me.status = 'err'; me.err = e.message; }
  if (shows()) render();
}
// 기록 목록 (아직 못 받았으면 null)
const mineList = () => (S.mine && S.mine.status === 'ok' ? S.mine.list : null);
function addMine(a) {
  if (!S.mine) S.mine = { status: 'err', list: null, added: [], err: '기록을 불러오지 못했어요.', more: false };
  if (S.mine.added.some(x => x.id === a.id) || (S.mine.list && S.mine.list.some(x => x.id === a.id))) return;  // 같은 답안을 두 번 보낸 경우
  S.mine.added.unshift(a); if (S.mine.list) S.mine.list.unshift(a);
}
// 회차 카드에 붙이는 최근 기록 요약
function bestText(xs, extra) {
  if (!xs) return '';
  if (!xs.length) return '아직 안 풀었어요';
  const pre = extra(xs[0]);
  return `최근${pre ? ' ' + pre : ''} <span class="num">${scoreText(xs[0])}</span> · ${xs.length}회 응시`;
}
// 회차를 고르면 문제를 받아 두고, 모듈·제한 시간을 고르는 화면으로 간다.
async function startTest(id) {
  S.busy = 'start' + id; S.err = ''; render();
  try {
    const j = await api('getTest', { code: S.code.trim(), id });
    S.pick = { test: j.test, showAnswers: j.showAnswers };
    S.screen = 'pick'; S.busy = ''; render(); window.scrollTo(0, 0);
  } catch (e) { S.err = e.message; S.busy = ''; render(); }
}
function startModule(mi) {
  const t = S.pick.test, m = t.modules[mi];
  const limit = Math.max(0, Math.min(120, Number(limitOf(t.id, mi, m)) || 0));
  S.exam = { test: t, showAnswers: S.pick.showAnswers, mod: mi, set: 0, answers: {}, startedAt: Date.now(), limit, endsAt: limit > 0 ? Date.now() + limit * 60000 : null, used: [] };
  persist(); S.screen = 'exam'; S.modal = null; render(); window.scrollTo(0, 0);
}
// 빈칸 모아 풀기: 고른 범위의 빈칸 지문만 받아 모듈 하나짜리 시험처럼 푼다.
async function startWords() {
  const { from, to } = wordsRange(), limit = Math.max(0, Math.min(300, Number(WR.lim) || 0));
  S.busy = 'words'; S.err = ''; render();
  try {
    const j = await api('getWords', { code: S.code.trim(), from, to });
    const sets = j.sets.map(s => ({ type: 'words', start: s.start, text: s.text, t: s.t, mi: s.mi, kp: s.t + '-' + s.mi }));
    S.exam = { kind: 'words', from, to, test: { id: span({ from, to }), modules: [{ name: '빈칸 모음', sets }] },
      mod: 0, set: 0, answers: {}, startedAt: Date.now(), limit, endsAt: limit > 0 ? Date.now() + limit * 60000 : null, used: [] };
    persist(); S.pick = null; S.screen = 'exam'; S.busy = ''; render(); window.scrollTo(0, 0);
  } catch (e) { S.err = e.message; S.busy = ''; render(); }
}
function wordsRange() {
  const ids = S.tests.map(t => t.id);
  let from = ids.includes(WR.from) ? WR.from : ids[0], to = ids.includes(WR.to) ? WR.to : ids[Math.min(ids.length, 10) - 1];
  if (to < from) to = from;
  return { from, to };
}
function persist() { lsSet(':exam', S.exam); }
function goSet(i) { S.exam.set = i; persist(); render(); window.scrollTo(0, 0); }
function unanswered() {
  const m = S.exam.test.modules[S.exam.mod];
  return m.sets.flatMap(s => keysOfSet(S.exam.mod, s)).filter(k => !(S.exam.answers[k] || '').trim()).length;
}
function submitModule() {
  const e = S.exam;
  let sec = Math.round((Date.now() - e.startedAt) / 1000);
  if (e.limit > 0) sec = Math.min(Math.round(e.limit * 60), sec);
  e.used = [sec];
  S.modal = null;
  finish();
}
async function finish() {
  const e = S.exam;
  // 다 풀었다는 표시와 응시 ID를 먼저 저장한다. 같은 응시 ID로 다시 보내면 서버가 두 번 기록하지 않는다.
  if (!e.attempt) e.attempt = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  e.done = true; persist();
  S.result = { pending: e, status: 'saving' }; S.screen = 'result'; render(); window.scrollTo(0, 0);
  const words = e.kind === 'words', lc = e.kind === 'lc';
  const who = { name: S.name.trim(), period: S.period, cls: S.cls };
  const body = Object.assign(words
    ? { code: S.code.trim(), from: e.from, to: e.to, limit: e.limit, answers: e.answers, used: e.used, startedAt: e.startedAt }
    : { code: S.code.trim(), id: e.test.id, module: e.mod, limit: e.limit, answers: e.answers, used: e.used, startedAt: e.startedAt }, who, { attempt: e.attempt }, lc && e.secs ? { secs: e.secs } : {});
  let j = null, err = '';
  for (let i = 0; i < 3 && !j; i++) {
    try { j = await api(words ? 'submitWords' : lc ? 'submitListening' : 'submit', body); } catch (x) { err = x.message; await new Promise(r => setTimeout(r, 1500)); }
  }
  if (j) {
    S.exam = null; lsSet(':exam', null);
    // 같은 회차의 다른 모듈을 바로 풀 수 있게
    S.pick = words || lc ? null : { test: e.test, showAnswers: e.showAnswers };
    S.lcPick = lc ? { test: e.test, showAnswers: e.showAnswers } : null;
    const r = j.result;
    addMine({ id: r.id, testId: r.testId, module: r.module, mod: words ? 'w' : e.mod, practice: r.practice || null, lc: r.lc || null, secs: r.secs || null,
      score: r.score, total: r.total, finishedAt: r.finishedAt, hidden: !!r.hidden });
    S.result = { r, showAnswers: j.showAnswers, status: 'ok', onlyWrong: true };
  } else {
    S.result = { pending: e, status: 'fail', err };
  }
  render();
}

/* ---------- 타이머 (제한이 있으면 남은 시간, 없으면 지난 시간) ---------- */
setInterval(() => {
  if (S.screen !== 'exam' || !S.exam) return;
  if (S.exam.kind === 'lc') { lcTick(); return; }
  const e = S.exam, el = document.getElementById('timer');
  if (e.endsAt) {
    const left = (e.endsAt - Date.now()) / 1000;
    if (el) { el.textContent = fmtTime(left); el.classList.toggle('low', left < 60); }
    if (left <= 0) submitModule();
  } else if (el) el.textContent = fmtTime((Date.now() - e.startedAt) / 1000);
}, 500);

/* ---------- 화면 ---------- */
function topBar() {
  let mid = '';
  if (S.screen === 'exam' && S.exam && S.exam.kind === 'lc') mid = lcTopBar();
  else if (S.screen === 'exam' && S.exam) {
    const e = S.exam, m = e.test.modules[e.mod];
    mid = `<span class="chip num">TEST ${esc(e.test.id)}</span><span class="chip">${m.name}</span><span class="spacer"></span>` +
      (e.endsAt ? `<span class="timer num" id="timer" aria-label="남은 시간">${fmtTime((e.endsAt - Date.now()) / 1000)}</span>`
        : `<span class="timer num up" id="timer" aria-label="지난 시간" title="제한 시간 없음">${fmtTime((Date.now() - e.startedAt) / 1000)}</span>`);
  } else {
    mid = `<span class="spacer"></span>` + (S.name && S.entered ? `<span class="chip">${esc(S.cls ? S.cls + ' · ' + S.name : S.name)}</span>` : '') +
      (S.screen !== 'home' ? `<button class="link" data-act="home">처음으로</button>` : '');
  }
  return `<header class="bar"><div class="wrap"><span class="brand">NEW TOEFL<small>모의고사</small></span>${mid}</div></header>`;
}

function viewHome() {
  if (!window.API_URL) return `<div class="banner warn">아직 서버 주소가 설정되지 않았어요. 선생님께 문의하세요.</div>`;
  if (!S.entered) {
    // 반 선택: 딕테이션 반 목록이 있으면 기간 → 반(그룹별), 없으면 반 이름을 직접 쓴다.
    const per = periodNow();
    const clsField = per
      ? `<label class="field">기간<select id="period">${PERS.map(p => `<option value="${esc(p.title)}"${p === per ? ' selected' : ''}>${esc(p.title)}</option>`).join('')}</select></label>
        <label class="field">반<select id="cls"><option value="">반을 선택하세요</option>${per.groups.map(g => `<optgroup label="${esc(g.name)}">${g.classes.map(c => {
          const v = g.name + ' ' + c; return `<option value="${esc(v)}"${v === S.cls ? ' selected' : ''}>${esc(c)}</option>`; }).join('')}</optgroup>`).join('')}</select></label>`
      : `<label class="field">반<input type="text" id="clsText" placeholder="예: 주니어 화목 U반" value="${esc(S.cls)}"></label>`;
    return `<div class="home">
      <section class="hero"><h1>리딩·리스닝 모의고사</h1>
        <p>반을 고르고 이름과 선생님께 받은 입장 코드를 입력하면 풀 수 있는 회차가 나와요. 회차를 고른 뒤 Module 1과 Module 2 중 하나를 골라 풀어요.</p></section>
      <form class="gate" id="gate">
        ${clsField}
        <label class="field">이름<input type="text" id="name" autocomplete="name" placeholder="이름" value="${esc(S.name)}"></label>
        <label class="field">입장 코드<input type="text" id="code" inputmode="text" autocomplete="off" placeholder="선생님께 받은 코드" value="${esc(S.code)}"></label>
        ${S.err ? `<div class="banner bad">${esc(S.err)}</div>` : ''}
        <div><button class="btn primary" type="submit"${S.busy ? ' disabled' : ''}>${S.busy === 'enter' ? '확인 중…' : '입장'}</button></div>
      </form></div>`;
  }
  const all = mineList(), best = id => bestText(all && all.filter(a => a.testId === id && !a.practice && !a.lc), a => modName(a.mod));
  const cards = S.tests.map(t => `<article class="tcard"><h3>TEST ${t.id}</h3>
    <dl>${t.modules.map(m => `<dt>${esc(m.name)}</dt><dd>${fmtMin(m.minutes)} · 단어 ${m.words} · 리딩 ${m.read}</dd>`).join('')}</dl>
    <div class="best">${best(t.id)}</div>
    <button class="btn primary" data-act="start" data-id="${t.id}"${S.busy ? ' disabled' : ''}>${S.busy === 'start' + t.id ? '불러오는 중…' : `TEST ${t.id} 선택`}</button></article>`).join('');
  const lcTab = S.tab === 'lc';
  return `<div class="home">
    <section class="hero"><h1>${esc(S.name)} 님, 회차를 골라 주세요</h1>
      <p>${lcTab ? '회차를 고른 뒤 Module 1과 Module 2 중 하나를 골라 풀어요. 음원은 한 번만 나오고, 문제는 하나씩 정해진 시간 안에 풀어요.'
        : '회차를 고른 뒤 Module 1과 Module 2 중 하나를 골라 풀어요. 빈칸 문제는 빠진 글자만 입력하세요.'} 끝나면 점수가 선생님께 자동으로 전달돼요.</p></section>
    ${S.exam && S.exam.done ? `<div class="banner warn">보내지 못한 답안이 있어요. 다른 시험을 시작하면 그 답안은 사라져요. <button class="btn small" data-act="retry">다시 보내기</button></div>` : ''}
    <div class="tabs" role="tablist"><button class="tab${lcTab ? '' : ' on'}" data-act="tab" data-tab="rc" role="tab" aria-selected="${!lcTab}">리딩</button><button class="tab${lcTab ? ' on' : ''}" data-act="tab" data-tab="lc" role="tab" aria-selected="${lcTab}">리스닝</button></div>
    ${S.err ? `<div class="banner bad">${esc(S.err)}</div>` : ''}
    ${lcTab ? viewLcList() : `${S.tests.length ? viewWordsCard() : ''}
    ${S.tests.length ? `<section class="tests">${cards}</section>` : `<div class="banner">지금 열려 있는 회차가 없어요. 선생님께 문의하세요.</div>`}`}
    <div class="toolbar"><span class="note">${esc(S.period ? S.period + ' · ' : '')}${esc(S.cls)} · ${esc(S.name)}</span><button class="btn small" data-act="changeWho">반·이름 바꾸기</button></div>
    ${viewMine()}</div>`;
}
// 내 기록: 어느 기기에서 풀었든 같은 반·이름으로 낸 기록. 누르면 문제와 함께 다시 본다.
function viewMine() {
  const M = S.mine; if (!M) return '';
  const head = `<h2 style="font-size:18px">내 기록 <span class="note" style="font-weight:400">${esc(S.cls)} · ${esc(S.name)} 이름으로 낸 기록</span></h2>`;
  if (M.status === 'loading') return `<section class="stack">${head}<div class="note">기록을 불러오는 중…</div></section>`;
  if (M.status === 'err') return `<section class="stack">${head}<div class="banner bad">${esc(M.err)} <button class="btn small" data-act="mineRetry">다시 불러오기</button></div></section>`;
  if (!M.list.length) return `<section class="stack">${head}<div class="note">아직 낸 기록이 없어요.</div></section>`;
  const SHOW = 20, list = M.more ? M.list : M.list.slice(0, SHOW);
  return `<section class="stack">${head}
    <div class="tablebox"><table><thead><tr><th>날짜</th><th>시험</th><th>점수</th><th></th></tr></thead><tbody>
    ${list.map(a => `<tr><td class="num">${fmtDate(a.finishedAt)}</td><td>${esc(recLabel(a))}</td><td class="num"><b>${scoreText(a)}</b></td>
      <td>${a.hidden ? '<span class="note">닫힌 회차</span>' : `<button class="btn small" data-act="review" data-id="${esc(a.id)}"${S.busy ? ' disabled' : ''}>다시 보기</button>`}</td></tr>`).join('')}
    </tbody></table></div>
    ${M.list.length > SHOW && !M.more ? `<div><button class="btn small" data-act="mineMore">이전 기록 ${M.list.length - SHOW}개 더 보기</button></div>` : ''}</section>`;
}

// 시험 화면 한 장: 빈칸은 지문 하나, 리딩은 실제 시험처럼 문제 하나 (지문은 문제마다 같이 보여 준다)
function pagesOf(m) { return m.sets.flatMap(s => (s.type === 'words' ? [{ s }] : s.questions.map(q => ({ s, q })))); }
function keysOfPage(mi, p) { return p.q ? [mi + '-' + p.q.n] : keysOfSet(mi, p.s); }
// 문장 넣기 문제에서만 ■ 자리를 고를 수 있게 하고, 같은 지문의 다른 문제에서는 ■ 표시를 지운다.
function renderPassage(set, mi, q) {
  let i = 0;
  const html = set.passage.split(/\n\n/).map(p => {
    let h = esc(p).replace(/\n/g, '<br>');
    h = q.insert ? h.replace(/■/g, () => { const L = LET[i++], k = mi + '-' + q.n;
      return `<button class="ins${S.exam.answers[k] === L ? ' on' : ''}" data-act="pick" data-k="${k}" data-v="${L}" aria-label="위치 ${L}">■ ${L}</button>`; })
      : h.replace(/ ?■ ?/g, ' ').replace(/ {2,}/g, ' ').trim();
    return `<p>${h}</p>`;
  }).join('');
  return `<div class="sheet passage">${set.title ? `<h3>${esc(set.title)}</h3>` : ''}${html}</div>`;
}
function renderQuestion(set, mi, q) {
  const k = mi + '-' + q.n, cur = S.exam.answers[k], choices = q.insert ? LET.map(L => `위치 ■ ${L}`) : q.c;
  return `<div class="sheet qs"><fieldset><legend><span class="num">${q.n}.</span>${q.insert ? '다음 문장이 들어갈 가장 알맞은 위치를 고르세요.' : esc(q.q)}</legend>
    ${q.insert ? `<div class="insert-sent">${esc(q.insert)}</div>` : ''}
    ${choices.map((c, ci) => `<label class="opt"><input type="radio" name="q${k}" data-k="${k}" value="${LET[ci]}"${cur === LET[ci] ? ' checked' : ''}><b>(${LET[ci]})</b><span>${esc(c)}</span></label>`).join('')}</fieldset></div>`;
}
function renderWords(set, mi) {
  let i = 0;
  // 앞 글자와 빈칸이 줄바꿈으로 떨어지지 않게 한 단어로 묶는다 ("popul" + 빈칸)
  const html = esc(set.text).replace(/(\S*?)\[(\d+)\]/g, (a, pre, len) => { const n = set.start + i++, k = keyPre(mi, set) + '-' + n;
    return `<span class="wd">${pre}<input class="blank" id="b${k}" data-k="${k}" data-len="${len}" maxlength="${len}" style="--n:${len}" value="${esc(S.exam.answers[k] || '')}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="빈칸 ${n}, ${len}글자"></span>`; });
  return `<div class="sheet words">${html}</div>`;
}
// 빈칸만 모아 풀기: 회차 범위와 제한 시간(기본 0 = 제한 없음)을 고른다.
function viewWordsCard() {
  const { from, to } = wordsRange(), c = wordsCount(from, to), lim = Number(WR.lim) || 0;
  const opts = sel => S.tests.map(t => `<option value="${t.id}"${t.id === sel ? ' selected' : ''}>TEST ${t.id}</option>`).join('');
  return `<section class="sheet stack wcard">
    <div><h2 style="font-size:18px">빈칸만 모아 풀기</h2>
      <p class="note" style="margin:4px 0 0">고른 회차들의 Complete the Words 지문만 이어서 풀어요. 기본은 제한 시간 없이 시계가 지난 시간을 세요.</p></div>
    <div class="toolbar"><label class="inline">처음 <select id="wFrom" aria-label="처음 회차">${opts(from)}</select></label>
      <label class="inline">끝 <select id="wTo" aria-label="끝 회차">${opts(to)}</select></label>
      <span class="note num">${c.tests}회차 · 지문 ${c.paras}개 · 빈칸 ${c.blanks}개</span></div>
    <label class="field">제한 시간 (분)<span class="inline"><input type="number" class="lim" id="wLim" min="0" max="300" step="1" value="${lim}" aria-label="빈칸 모아 풀기 제한 시간(분)"><span class="note">0이면 제한 없이 풀어요</span></span></label>
    <div><button class="btn primary" data-act="startWords"${S.busy ? ' disabled' : ''}>${S.busy === 'words' ? '불러오는 중…' : '빈칸 풀기 시작'}</button></div></section>`;
}
// 모듈과 제한 시간을 고르는 화면. 제한 시간은 모듈 기본값으로 채워지고, 바꾸면 이 기기에 기억된다. 0이면 제한 없이 푼다.
function viewPick() {
  const t = S.pick.test;
  const cards = t.modules.map((m, mi) => {
    const words = m.sets.filter(s => s.type === 'words').reduce((n, s) => n + blanksOf(s).length, 0);
    const read = m.sets.filter(s => s.type === 'read').reduce((n, s) => n + s.questions.length, 0);
    const all = mineList(), done = all && all.filter(a => a.testId === t.id && !a.practice && !a.lc && a.mod === mi);
    return `<article class="tcard"><h3>${esc(m.name)}</h3>
      <dl><dt>문제</dt><dd>단어 ${words} · 리딩 ${read} · 총 ${words + read}문제</dd><dt>기본 시간</dt><dd>${fmtMin(m.minutes)}</dd></dl>
      <label class="field">제한 시간 (분)<span class="inline"><input type="number" class="lim" id="lim${mi}" data-mi="${mi}" min="0" max="120" step="0.5" value="${limitOf(t.id, mi, m)}" aria-label="${esc(m.name)} 제한 시간(분)"><span class="note">0이면 제한 없이 풀어요</span></span></label>
      <div class="best">${bestText(done, () => '')}</div>
      <button class="btn primary" data-act="startMod" data-mi="${mi}">${esc(m.name)} 시작</button></article>`;
  }).join('');
  return `<div class="home">
    <div class="qhead" style="margin:0"><h2 style="font-size:24px">TEST ${t.id}</h2><button class="btn small" data-act="home">회차 목록</button></div>
    <p class="note" style="margin:0">풀 모듈을 하나 고르세요. 시작 버튼을 누르면 타이머가 바로 돌아가고, 제한 시간이 끝나면 자동으로 제출돼요. 한 모듈을 끝내면 다른 모듈도 이어서 풀 수 있어요.</p>
    <section class="tests">${cards}</section></div>`;
}
// e.set은 지금 보는 화면 번호다 (pagesOf 순서).
function viewExam() {
  if (S.exam.kind === 'lc') return viewLcExam();
  const e = S.exam, m = e.test.modules[e.mod], pages = pagesOf(m);
  const pi = Math.min(e.set || 0, pages.length - 1), p = pages[pi], set = p.s, last = pi === pages.length - 1;
  // 빈칸 모음은 지문이 많아 번호만 보여 주고, 어느 회차·모듈인지는 툴팁으로 알려 준다.
  const dots = pages.map((pg, i) => { const done = keysOfPage(e.mod, pg).every(k => (e.answers[k] || '').trim());
    const label = e.kind === 'words' ? `${i + 1}` : pg.q ? `${pg.q.n}` : rangeOf(pg.s);
    const full = e.kind === 'words' ? `TEST ${pg.s.t} Module ${pg.s.mi + 1} ${rangeOf(pg.s).replace(/^T\d+ /, '')}` : `문제 ${label}`;
    return `<button class="dot${done ? ' done' : ''}${i === pi ? ' cur' : ''}" data-act="go" data-i="${i}" aria-label="${full}" title="${full}">${label}</button>`; }).join('');
  const body = set.type === 'words' ? renderWords(set, e.mod) : `<div class="split">${renderPassage(set, e.mod, p.q)}${renderQuestion(set, e.mod, p.q)}</div>`;
  const total = m.sets.flatMap(s => keysOfSet(e.mod, s)).length;
  const where = e.kind === 'words' ? `지문 ${pi + 1} / ${pages.length} · TEST ${set.t} Module ${set.mi + 1} · ${blanksOf(set)[0].n}–${blanksOf(set).slice(-1)[0].n}번`
    : p.q ? `Question ${p.q.n} of ${total}` : `Questions ${rangeOf(set)} of ${total}`;
  return `<div class="qhead"><h2>${set.type === 'words' ? 'Fill in the missing letters in the paragraph' : esc(set.kind)}</h2><span class="note num">${where}</span></div>
    ${body}
    <div class="navrow"><button class="btn" data-act="go" data-i="${pi - 1}"${pi === 0 ? ' disabled' : ''}>이전</button><div class="dots">${dots}</div>
      ${last ? `<button class="btn primary" data-act="askSubmit">${m.name} 제출</button>` : `<button class="btn primary" data-act="go" data-i="${pi + 1}">다음</button>`}</div>`;
}

function scoreBlock(r) {
  return `<div class="score"><div><div class="eyebrow">총점</div><div class="big">${r.score}<small>/${r.total}</small></div></div>
    <div class="parts">${['0w', '0r', '1w', '1r', 'w', 'resp', 'conv', 'ann', 'talk'].filter(k => r.parts[k]).map(k => `<div class="part"><div class="lbl">${PART_LABEL[k] || LC_PART[k]}</div><div class="val">${r.parts[k][0]}/${r.parts[k][1]}</div></div>`).join('')}</div></div>`;
}
function reviewTable(r, onlyWrong, showAnswers) {
  const rows = r.rows.filter(x => !onlyWrong || !x.ok);
  if (!rows.length) return `<div class="tablebox"><div class="empty">틀린 문항이 없어요.</div></div>`;
  return `<div class="tablebox"><table><thead><tr><th>문항</th><th>유형</th><th></th><th>제출한 답</th>${showAnswers ? '<th>정답</th>' : ''}</tr></thead><tbody>
    ${rows.map(x => `<tr class="${x.ok ? '' : 'badrow'}"><td class="num">${rowLabel(x)}</td><td>${x.kind === 'w' ? '단어' : x.kind === 'l' ? LC_TYPE[x.type] || '리스닝' : '리딩'}</td>
      <td class="mark ${x.ok ? 'ok' : 'bad'}">${x.ok ? 'O' : 'X'}</td>
      <td class="given ${x.ok ? '' : (x.given ? 'bad' : 'empty')}">${x.given ? esc(x.given) : '(빈칸)'}</td>
      ${showAnswers ? `<td>${x.kind === 'w' ? `${esc(x.correct)} <span class="note">(${esc(x.full)})</span>` : esc(x.correct)}</td>` : ''}</tr>`).join('')}
  </tbody></table></div>`;
}
function viewResult() {
  const R = S.result;
  if (R.status === 'saving') return `<div class="sheet stack" style="max-width:520px"><h2>채점 중이에요…</h2><p class="note" style="margin:0">답안을 선생님께 보내고 채점하고 있어요. 잠시만 기다려 주세요.</p></div>`;
  if (R.status === 'fail') return `<div class="sheet stack" style="max-width:520px"><h2>제출이 안 됐어요</h2>
    <div class="banner bad">${esc(R.err)}</div><p class="note" style="margin:0">답안은 이 기기에 남아 있어요. 인터넷을 확인하고 다시 보내 주세요. 입장 코드가 바뀌었으면 처음 화면에서 새 코드로 들어온 뒤 다시 보내면 돼요.</p>
    <div class="toolbar"><button class="btn primary" data-act="retry">다시 보내기</button>${R.ask ? '' : `<button class="btn" data-act="askDiscard">답안 버리기</button>`}</div>
    ${R.ask ? `<div class="banner bad">이 답안을 버릴까요? 선생님께 가지 않아요.<div class="toolbar" style="margin-top:8px"><button class="btn" data-act="discard">버리기</button><button class="btn" data-act="cancelDiscard">취소</button></div></div>` : ''}</div>`;
  const r = R.r;
  const limitText = r.lc ? '' : r.limit > 0 ? ` (제한 ${fmtMin(r.limit)})` : ' (제한 없음)';
  return `<div class="stack">
    <div class="qhead"><h2>${recTitle(r)} 결과 · ${esc(r.name)}</h2><span class="note num">소요 ${fmtTime(r.used[0] || 0)}${limitText}</span></div>
    ${r.hidden ? `<div class="banner ok">답안이 선생님께 전달됐어요. 이 회차는 지금 닫혀 있어서 점수와 채점 결과는 선생님만 볼 수 있어요.</div>` : `${scoreBlock(r)}
    <div class="banner ok">결과가 선생님께 전달됐어요.</div>`}
    <div class="toolbar">${r.hidden ? '' : `<label class="check note"><input type="checkbox" id="onlyWrong" ${R.onlyWrong ? 'checked' : ''}> 틀린 문항만 보기</label>`}<span class="spacer"></span>
      ${r.hidden || !r.id ? '' : `<button class="btn" data-act="review" data-id="${esc(r.id)}" data-back="result">문제와 함께 보기</button>`}
      ${S.pick ? `<button class="btn" data-act="pickAgain">TEST ${r.testId} 다른 모듈 풀기</button>` : ''}${S.lcPick && r.lc ? `<button class="btn" data-act="lcPickAgain">${esc(r.lc.title)} 다른 모듈 풀기</button>` : ''}<button class="btn primary" data-act="home">${r.practice ? '처음 화면으로' : '다른 회차 풀기'}</button></div>
    ${r.hidden ? '' : reviewTable(r, R.onlyWrong, R.showAnswers)}</div>`;
}

/* ---------- 다시 보기 ---------- */
// 기록 하나를 서버에서 받아 문제와 함께 보여 준다. 문제는 지금 열린 회차만, 정답은 정답 공개가 켜져 있을 때만 온다.
async function openReview(id, back) {
  const me = S.review = { id, back, status: 'loading', onlyWrong: false };
  S.screen = 'review'; render(); window.scrollTo(0, 0);
  try {
    const j = await api('myResult', { code: S.code.trim(), name: S.name.trim(), cls: S.cls.trim(), id });
    if (S.review !== me) return;
    Object.assign(me, { status: 'ok', r: j.result, showAnswers: j.showAnswers, content: j.content });
  } catch (e) { if (S.review !== me) return; me.status = 'err'; me.err = e.message; }
  if (S.screen === 'review') render();
}
// 목록에서 열었으면 그 기록 줄로 돌아간다
function closeReview() {
  const V = S.review || {}, home = !(V.back === 'result' && S.result);
  rvRelease(); S.review = null;
  S.screen = home ? 'home' : 'result'; render();
  const row = home && V.id && document.querySelector(`[data-act="review"][data-id="${CSS.escape(V.id)}"]`);
  if (row) row.scrollIntoView({ block: 'center' }); else window.scrollTo(0, 0);
}
const rowMap = rows => { const by = {}; rows.forEach(x => { by[x.k] = x; }); return by; };
function viewReview() {
  const V = S.review, back = `<button class="btn" data-act="reviewBack">${V.back === 'result' ? '결과로 돌아가기' : '기록 목록으로'}</button>`;
  if (V.status === 'loading') return `<div class="sheet stack" style="max-width:520px"><h2>기록을 불러오는 중…</h2><div>${back}</div></div>`;
  if (V.status === 'err') return `<div class="sheet stack" style="max-width:520px"><h2>기록을 불러오지 못했어요</h2><div class="banner bad">${esc(V.err)}</div>
    <div class="toolbar"><button class="btn primary" data-act="reviewRetry">다시 시도</button>${back}</div></div>`;
  const r = V.r;
  const head = `<div class="qhead"><h2>${recTitle(r)} · ${esc(r.name)}</h2><span class="note num">${fmtDate(r.finishedAt)} 제출 · 소요 ${fmtTime(r.used[0] || 0)}</span></div>`;
  if (r.hidden) return `<div class="stack">${head}<div class="banner">이 회차는 지금 닫혀 있어서 점수와 문제를 볼 수 없어요. 다시 보려면 선생님께 회차를 열어 달라고 하세요.</div><div>${back}</div></div>`;
  // 그리는 함수들이 화면에 그린 문항을 V.seen에 적는다. 문제를 못 받았거나 문제가 바뀌어 못 그린 문항은 표로 보여 준다.
  V.seen = new Set();
  const body = !V.content ? '' : r.lc ? lcReviewBody(V) : r.practice ? wordsReviewBody(V) : rcReviewBody(V);
  const rest = r.rows.filter(x => !V.seen.has(x.k) && (!V.onlyWrong || !x.ok));
  const table = rest.length ? `<p class="note" style="margin:0">${V.content ? '문제가 바뀌어서 아래 문항은 표로만 보여 줘요.' : '문제를 불러올 수 없어서 표로만 보여 줘요.'}</p>${reviewTable({ rows: rest }, false, V.showAnswers)}` : '';
  const none = V.onlyWrong && !r.rows.some(x => !x.ok) ? `<div class="tablebox"><div class="empty">틀린 문항이 없어요.</div></div>` : '';
  return `<div class="stack">${head}${scoreBlock(r)}
    ${V.showAnswers ? '' : '<div class="banner">선생님이 정답 공개를 꺼 두셔서 맞았는지 틀렸는지만 보여요.</div>'}
    ${r.cut ? `<div class="banner">지금 닫혀 있는 회차의 ${r.cut}문항은 빼고 보여 줘요. 위 점수는 남은 문항만 센 거예요${r.orig ? ` (처음 점수 <span class="num">${r.orig.score}/${r.orig.total}</span>)` : ''}.</div>` : ''}
    <div class="toolbar"><label class="check note"><input type="checkbox" id="rvOnlyWrong"${V.onlyWrong ? ' checked' : ''}> 틀린 문항만 보기</label><span class="spacer"></span>${back}</div>
    ${none || body + table}
    <div class="toolbar"><span class="spacer"></span>${back}</div></div>`;
}
// 리딩: 모듈마다 지문 순서대로
function rcReviewBody(V) {
  const r = V.r, by = rowMap(r.rows);
  return V.content.test.modules.map((m, mi) => {
    if (r.module != null && mi !== r.module) return '';
    const html = m.sets.map(s => (s.type === 'words' ? rvWords(s, mi, by, V, '') : rvRead(s, mi, by, V))).join('');
    return html ? `<section class="stack"><h3 class="rvmod">${esc(m.name)}</h3>${html}</section>` : '';
  }).join('');
}
// 빈칸 모아 풀기: 회차·모듈마다 빈칸 지문
function wordsReviewBody(V) {
  const by = rowMap(V.r.rows);
  return V.content.sets.map(s => rvWords(s, s.t + '-' + s.mi, by, V, `TEST ${esc(s.t)} · Module ${s.mi + 1}`)).join('');
}
// 빈칸 지문 하나: 낸 글자를 채워 넣고, 틀린 칸은 정답(정답 공개일 때)을 옆에 붙인다. kp는 답 키 앞부분 ("0" 또는 "7-0")
function rvWords(set, kp, by, V, title) {
  const bl = blanksOf(set), xs = bl.map(b => by[kp + '-' + b.n]);
  xs.forEach(x => x && V.seen.add(x.k));
  if (!xs.some(Boolean) || (V.onlyWrong && !xs.some(x => x && !x.ok))) return '';
  let i = 0;
  const html = esc(set.text).replace(/(\S*?)\[(\d+)\]/g, (a, pre, len) => {
    const b = bl[i++], x = by[kp + '-' + b.n], gap = '_'.repeat(+len);
    if (!x) return `<span class="wd">${pre}<span class="rvb">${gap}</span></span>`;
    const fix = !x.ok && x.correct ? `<span class="rvb fix">${esc(x.correct)}</span>` : '';
    return `<span class="wd">${pre}<span class="rvb ${x.ok ? 'ok' : x.given ? 'bad' : 'bad none'}">${x.given ? esc(x.given) : gap}</span>${fix}<span class="sr"> (${b.n}번 ${x.ok ? '맞음' : '틀림'}${fix ? ', 정답 ' + esc(x.correct) : ''})</span></span>`;
  });
  return `<div class="sheet words rvwords">${title ? `<div class="eyebrow">${title}</div>` : ''}${html}</div>`;
}
// 리딩 지문 하나와 그 문제들. 문장 넣기 문제가 있으면 지문의 ■ 자리에 A~D를 붙이고, 내가 고른 자리와 정답 자리를 칠한다.
function rvRead(set, mi, by, V) {
  set.questions.forEach(q => { const x = by[mi + '-' + q.n]; if (x) V.seen.add(x.k); });
  const qs = set.questions.filter(q => { const x = by[mi + '-' + q.n]; return x && (!V.onlyWrong || !x.ok); });
  if (!qs.length) return '';
  const ins = set.questions.find(q => q.insert), ix = ins && by[mi + '-' + ins.n];
  let i = 0;
  const mark = () => { const L = LET[i++] || '', c = ix ? (ix.given === L ? (ix.ok ? ' mine' : ' mine bad') : '') + (ix.correct === L ? ' right' : '') : '';
    return `<span class="insmark${c}">■ ${L}</span>`; };
  const passage = set.passage.split(/\n\n/).map(p => {
    const h = esc(p).replace(/\n/g, '<br>');
    return `<p>${ins ? h.replace(/■/g, mark) : h.replace(/ ?■ ?/g, ' ').replace(/ {2,}/g, ' ').trim()}</p>`;
  }).join('');
  const cards = qs.map(q => rvChoice(q.n, q.insert ? '다음 문장이 들어갈 가장 알맞은 위치를 고르세요.' : q.q, q.insert ? LET.map(L => `위치 ■ ${L}`) : q.c,
    by[mi + '-' + q.n], q.insert ? `<div class="insert-sent">${esc(q.insert)}</div>` : '')).join('');
  return `<div class="split rvsplit"><div class="sheet passage">${set.kind ? `<div class="eyebrow">${esc(set.kind)}</div>` : ''}${set.title ? `<h3>${esc(set.title)}</h3>` : ''}${passage}</div>
    <div class="stack">${cards}</div></div>`;
}
// 객관식 한 문제: 내 답과 정답(정답 공개일 때만 x.correct가 있다)을 표시한다
function rvChoice(n, text, choices, x, extra) {
  return `<div class="sheet rvq${x.ok ? '' : ' wrong'}"><div class="rvqh"><span class="mark ${x.ok ? 'ok' : 'bad'}">${x.ok ? 'O' : 'X'}<span class="sr">${x.ok ? ' 맞음' : ' 틀림'}</span></span>
    <span><span class="num">${n}.</span> ${esc(text)}</span></div>${extra || ''}
    <div class="opts">${choices.map((c, ci) => { const L = LET[ci], mine = x.given === L, right = x.correct === L;
      return `<div class="opt rv${mine ? (x.ok ? ' mine' : ' mine bad') : ''}${right ? ' right' : ''}"><b>(${L})</b><span>${esc(c)}</span>${mine ? '<span class="tag">내 답</span>' : ''}${right ? '<span class="tag ok">정답</span>' : ''}</div>`; }).join('')}</div>
    ${x.given ? '' : '<div class="note">답을 고르지 않았어요.</div>'}</div>`;
}
function viewModal() {
  const md = S.modal; if (!md) return '';
  if (md.kind === 'submit') { const n = unanswered(), m = S.exam.test.modules[S.exam.mod];
    return `<div class="modal" role="dialog" aria-modal="true"><div class="box"><h3>${m.name} 답안을 제출할까요?</h3>
      <p class="note" style="margin:0">${n ? `아직 <b>${n}문제</b>를 풀지 않았어요. ` : ''}제출하면 이 답안으로 다시 돌아올 수 없어요.</p>
      <div class="row"><button class="btn" data-act="closeModal">계속 풀기</button><button class="btn primary" data-act="submit">제출</button></div></div></div>`; }
  return '';
}
function render() {
  const app = document.getElementById('app'), active = document.activeElement && document.activeElement.id;
  const view = S.screen === 'exam' && S.exam ? viewExam() : S.screen === 'result' && S.result ? viewResult() : S.screen === 'pick' && S.pick ? viewPick()
    : S.screen === 'lcpick' && S.lcPick ? viewLcPick() : S.screen === 'review' && S.review ? viewReview() : viewHome();
  app.innerHTML = topBar() + `<main class="wrap">${view}</main>` + viewModal();
  document.body.classList.toggle('exam-on', S.screen === 'exam' && !!S.exam);
  document.body.classList.toggle('review-on', S.screen === 'review' && !!S.review);
  if (active) { const el = document.getElementById(active); if (el) el.focus(); }
}

/* ---------- 이벤트 ---------- */
document.addEventListener('submit', ev => { if (ev.target.id === 'gate') { ev.preventDefault(); enter(); } });
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'start') startTest(+b.dataset.id);
  else if (act === 'startMod') startModule(+b.dataset.mi);
  else if (act === 'startWords') startWords();
  else if (act === 'go') goSet(+b.dataset.i);
  else if (act === 'askSubmit') { S.modal = { kind: 'submit' }; render(); }
  else if (act === 'submit') submitModule();
  else if (act === 'closeModal') { S.modal = null; render(); }
  else if (act === 'pick') { S.exam.answers[b.dataset.k] = b.dataset.v; persist(); render(); }
  else if (act === 'pickAgain') { S.screen = 'pick'; S.result = null; S.err = ''; render(); window.scrollTo(0, 0); }
  else if (act === 'home') { rvRelease(); S.screen = 'home'; S.result = null; S.pick = null; S.lcPick = null; S.review = null; S.err = ''; render(); }
  else if (act === 'changeWho') { S.entered = false; S.tests = []; S.lcTests = []; S.pick = null; S.lcPick = null; S.mine = null; S.err = ''; render(); }
  else if (act === 'review') openReview(b.dataset.id, b.dataset.back || 'home');
  else if (act === 'reviewRetry' && S.review) openReview(S.review.id, S.review.back);
  else if (act === 'reviewBack') closeReview();
  else if (act === 'mineRetry') loadMine();
  else if (act === 'mineMore' && S.mine) { S.mine.more = true; render(); }
  else if (act === 'retry') { if (S.result && S.result.pending) S.exam = S.result.pending; if (S.exam) finish(); }
  else if (act === 'askDiscard') { S.result.ask = true; render(); }
  else if (act === 'cancelDiscard') { S.result.ask = false; render(); }
  else if (act === 'discard') { S.exam = null; lsSet(':exam', null); S.result = null; S.screen = 'home'; render(); }
});
// 시험·다시 보기 화면에서는 문제를 복사하지 못하게 한다
const guarded = () => document.body.classList.contains('exam-on') || document.body.classList.contains('review-on');
document.addEventListener('contextmenu', ev => { if (guarded()) ev.preventDefault(); });
document.addEventListener('copy', ev => { if (guarded() && !(ev.target.classList && ev.target.classList.contains('blank'))) ev.preventDefault(); });
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.id === 'name') { S.name = el.value; return; }
  if (el.id === 'clsText') { S.cls = el.value; return; }
  if (el.id === 'code') { S.code = el.value; return; }
  // 제한 시간은 치는 동안에도 기억해 둔다 (내 기록을 받아 화면을 다시 그려도 친 값이 남게)
  if (el.id === 'wLim') { WR.lim = Math.max(0, Math.min(300, Number(el.value) || 0)); lsSet(':wr', WR); return; }
  if (el.classList.contains('lim') && S.pick && el.dataset.mi != null) { LIM[S.pick.test.id + '-' + el.dataset.mi] = Math.max(0, Math.min(120, Number(el.value) || 0)); lsSet(':lim', LIM); return; }
  if (el.classList.contains('blank')) {
    el.value = el.value.replace(/[^A-Za-z]/g, '').toLowerCase();
    S.exam.answers[el.dataset.k] = el.value; persist();
    if (el.value.length >= +el.dataset.len) { const all = [...document.querySelectorAll('input.blank')], i = all.indexOf(el); if (all[i + 1]) all[i + 1].focus(); }
    updateDots();
  }
});
document.addEventListener('keydown', ev => {
  const el = ev.target;
  if (el.classList && el.classList.contains('blank') && ev.key === 'Backspace' && !el.value) {
    const all = [...document.querySelectorAll('input.blank')], i = all.indexOf(el);
    if (all[i - 1]) { ev.preventDefault(); all[i - 1].focus(); }
  }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.type === 'radio' && el.dataset.k) {
    S.exam.answers[el.dataset.k] = el.value; persist();
    document.querySelectorAll(`button.ins[data-k="${el.dataset.k}"]`).forEach(x => x.classList.toggle('on', x.dataset.v === el.value));
    updateDots();
  } else if (el.id === 'onlyWrong') { S.result.onlyWrong = el.checked; render(); }
  else if (el.id === 'rvOnlyWrong' && S.review) { S.review.onlyWrong = el.checked; render(); }
  else if (el.id === 'period') { S.period = el.value; S.cls = ''; render(); }
  else if (el.id === 'cls') { S.cls = el.value; }
  else if (el.id === 'wFrom' || el.id === 'wTo') {
    const r = wordsRange(), v = +el.value;
    if (el.id === 'wFrom') { WR.from = v; WR.to = Math.max(v, r.to); } else { WR.to = v; WR.from = Math.min(v, r.from); }
    lsSet(':wr', WR); render();
  } else if (el.id === 'wLim') {
    const v = Math.max(0, Math.min(300, Number(el.value) || 0)); el.value = v;
    WR.lim = v; lsSet(':wr', WR);
  } else if (el.classList.contains('lim') && S.pick) {
    const v = Math.max(0, Math.min(120, Number(el.value) || 0)); el.value = v;
    LIM[S.pick.test.id + '-' + el.dataset.mi] = v; lsSet(':lim', LIM);
  }
});
function updateDots() {
  if (!S.exam) return;
  const m = S.exam.test.modules[S.exam.mod];
  const pages = pagesOf(m);
  document.querySelectorAll('.dot').forEach((d, i) => { const p = pages[i]; if (p) d.classList.toggle('done', keysOfPage(S.exam.mod, p).every(k => (S.exam.answers[k] || '').trim())); });
}
render();
</script>
</body>
</html>
